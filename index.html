<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Always revalidate shell HTML so hashed asset map is never stale after deploy -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- Required for YouTube embeds (Error 153 without a valid referrer) -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="description" content="Coiny — премиальный, интерактивный веб-клиент Telegram с поддержкой тем, историй, анимированных чатов и умных ИИ-ботов." />
    <title>Coiny</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
