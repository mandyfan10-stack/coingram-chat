name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: |
          npm audit --audit-level=low
          npm audit --omit=dev --audit-level=low

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build web client
        run: npm run build

  live-e2e:
    name: Two-user messenger E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      E2E_USER_A: ${{ secrets.E2E_USER_A }}
      E2E_PASSWORD_A: ${{ secrets.E2E_PASSWORD_A }}
      E2E_ENCRYPTION_PASSWORD_A: ${{ secrets.E2E_ENCRYPTION_PASSWORD_A }}
      E2E_USER_B: ${{ secrets.E2E_USER_B }}
      E2E_PASSWORD_B: ${{ secrets.E2E_PASSWORD_B }}
      E2E_ENCRYPTION_PASSWORD_B: ${{ secrets.E2E_ENCRYPTION_PASSWORD_B }}
    steps:
      - name: Require QA secrets on protected main
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          test -n "$E2E_USER_A"
          test -n "$E2E_PASSWORD_A"
          test -n "$E2E_ENCRYPTION_PASSWORD_A"
          test -n "$E2E_USER_B"
          test -n "$E2E_PASSWORD_B"
          test -n "$E2E_ENCRYPTION_PASSWORD_B"

      - name: Checkout
        if: ${{ env.E2E_USER_A != '' && env.E2E_USER_B != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        if: ${{ env.E2E_USER_A != '' && env.E2E_USER_B != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        if: ${{ env.E2E_USER_A != '' && env.E2E_USER_B != '' }}
        run: npm ci

      - name: Install Chromium
        if: ${{ env.E2E_USER_A != '' && env.E2E_USER_B != '' }}
        run: npx playwright install --with-deps chromium

      - name: Run live E2E
        if: ${{ env.E2E_USER_A != '' && env.E2E_USER_B != '' }}
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  supabase:
    name: Supabase reset, tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: |
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            set +e
            npx supabase start 2>&1 | tee supabase-start.log
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if [ "$attempt" -eq "$attempts" ] || ! grep -Eqi \
              'toomanyrequests|rate exceeded|error pulling image|failed to (resolve|copy|fetch)|TLS handshake timeout|i/o timeout|unexpected EOF|connection reset by peer' \
              supabase-start.log; then
              exit "$status"
            fi

            echo "Transient container image pull failure; retrying Supabase start ($attempt/$attempts)."
            sleep $((attempt * 15))
          done

      - name: Reset schema and run pgTAP
        run: |
          npx supabase db reset --local --no-seed
          npx supabase test db supabase/tests --local

      - name: Database lint
        run: npx supabase db lint --local --level warning --fail-on warning
