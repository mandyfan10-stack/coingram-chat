name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build web client
        run: npm run build

  live-e2e:
    name: Two-user messenger E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_USER_A: ${{ secrets.E2E_USER_A }}
      E2E_PASSWORD_A: ${{ secrets.E2E_PASSWORD_A }}
      E2E_ENCRYPTION_PASSWORD_A: ${{ secrets.E2E_ENCRYPTION_PASSWORD_A }}
      E2E_USER_B: ${{ secrets.E2E_USER_B }}
      E2E_PASSWORD_B: ${{ secrets.E2E_PASSWORD_B }}
      E2E_ENCRYPTION_PASSWORD_B: ${{ secrets.E2E_ENCRYPTION_PASSWORD_B }}
    steps:
      - name: Explain skipped live E2E
        if: ${{ env.E2E_USER_A == '' || env.E2E_USER_B == '' }}
        run: echo 'Live E2E skipped because QA account secrets are not configured.'

      - name: Checkout
        if: ${{ env.E2E_USER_A != '' && env.E2E_USER_B != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        if: ${{ env.E2E_USER_A != '' && env.E2E_USER_B != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        if: ${{ env.E2E_USER_A != '' && env.E2E_USER_B != '' }}
        run: npm ci

      - name: Install Chromium
        if: ${{ env.E2E_USER_A != '' && env.E2E_USER_B != '' }}
        run: npx playwright install --with-deps chromium

      - name: Run live E2E
        if: ${{ env.E2E_USER_A != '' && env.E2E_USER_B != '' }}
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
